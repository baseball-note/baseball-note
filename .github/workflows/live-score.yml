name: 라이브 스코어 업데이트

on:
  schedule:
    # 한국시간 14시~자정(UTC 5~14시) 10분마다
    - cron: "*/10 5-14 * * *"
  workflow_dispatch: {}   # Actions 탭이나 사이트의 "점수 지금 가져오기"에서 바로 실행

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  games:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 패키지 설치
        run: pip install -r scripts/requirements.txt

      - name: 경기 점수 읽기
        run: python scripts/fetch_games.py

      - name: 바뀐 점수 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json
          if git diff --cached --quiet; then
            echo "바뀐 점수가 없어요."
            exit 0
          fi
          git commit -m "games: $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1

