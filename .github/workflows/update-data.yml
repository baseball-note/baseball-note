name: 야구 데이터 매일 업데이트

on:
  schedule:
    # 한국시간 매일 새벽 2시(UTC 17시)
    - cron: "0 17 * * *"
  workflow_dispatch: {}   # Actions 탭에서 Run workflow로 바로 실행

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 패키지 설치
        run: pip install -r scripts/requirements.txt

      # 한 스크립트가 실패해도 나머지는 계속 돌고, 마지막에 실패를 알려줘요.
      - name: KBO 순위·기록
        id: kbo
        continue-on-error: true
        run: python scripts/fetch_kbo.py

      - name: 어제·오늘 경기
        id: games
        continue-on-error: true
        run: python scripts/fetch_games.py

      - name: 코리안 메이저리거
        id: mlb
        continue-on-error: true
        run: python scripts/fetch_mlb.py

      - name: 바뀐 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "바뀐 데이터가 없어요."
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash && git push; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = 1 ] || exit 1
          fi

      - name: 실패한 단계 확인
        if: steps.kbo.outcome == 'failure' || steps.games.outcome == 'failure' || steps.mlb.outcome == 'failure'
        run: |
          echo "KBO: ${{ steps.kbo.outcome }} / 경기: ${{ steps.games.outcome }} / MLB: ${{ steps.mlb.outcome }}"
          echo "실패한 단계의 로그를 열어 확인하세요. 성공한 데이터는 이미 저장됐어요."
          exit 1
